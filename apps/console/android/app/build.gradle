apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def versionFile = file('../version.json')
if (!versionFile.exists()) {
    throw new GradleException('Missing canonical Android version file')
}
def appVersion = new JsonSlurper().parse(versionFile)
def releaseSigningEnv = [
    storeFile: System.getenv('TERMINAL_MCP_ANDROID_KEYSTORE'),
    storePassword: System.getenv('TERMINAL_MCP_ANDROID_STORE_PASSWORD'),
    keyAlias: System.getenv('TERMINAL_MCP_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('TERMINAL_MCP_ANDROID_KEY_PASSWORD')
]
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def releaseSigningReady = releaseSigningEnv.values().every { it != null && !it.isBlank() }
if (releaseRequested && !releaseSigningReady) {
    throw new GradleException(
        'Release signing requires TERMINAL_MCP_ANDROID_KEYSTORE, ' +
        'TERMINAL_MCP_ANDROID_STORE_PASSWORD, TERMINAL_MCP_ANDROID_KEY_ALIAS and ' +
        'TERMINAL_MCP_ANDROID_KEY_PASSWORD. Use npm run android:build:release so the ' +
        'protected host signing environment is loaded automatically.'
    )
}

android {
    namespace = "app.terminalmcp.console"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.terminalmcp.console"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.versionCode as int
        versionName appVersion.versionName as String
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseSigningEnv.storeFile)
                storePassword releaseSigningEnv.storePassword
                keyAlias releaseSigningEnv.keyAlias
                keyPassword releaseSigningEnv.keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

