[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "terminal-mcp"
dynamic = ["version"]
description = "Durable MCP service for asynchronous Linux and Windows terminal commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.30,<2",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pywin32>=308; sys_platform == 'win32'",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
compact = ["jsonschema>=4.23,<5", "tiktoken==0.12.0"]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
terminal-mcp = "terminal_mcp.__main__:main"

[tool.hatch.version]
path = "src/terminal_mcp/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Remove passed tests' tmp_path SQLite files during teardown, retaining failed cases.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
